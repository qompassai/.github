<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420">
  <defs>
    <radialGradient id="glowV" cx="88%" cy="-10%" r="70%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="6%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#5B8CFF" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#5B8CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#1B2A44" stroke-width="1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" fill="#04070F"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <rect width="1600" height="420" fill="url(#glowV)"/>
  <rect width="1600" height="420" fill="url(#glowC)"/>

  <!-- starfield -->
  <g fill="#E8EEF7">
    <circle cx="120" cy="52" r="1.6" opacity="0.8"/><circle cx="310" cy="30" r="1.1" opacity="0.5"/>
    <circle cx="520" cy="66" r="1.4" opacity="0.65"/><circle cx="700" cy="36" r="1.0" opacity="0.45"/>
    <circle cx="880" cy="58" r="1.5" opacity="0.7"/><circle cx="1020" cy="28" r="1.1" opacity="0.5"/>
    <circle cx="90" cy="150" r="1.0" opacity="0.4"/><circle cx="240" cy="330" r="1.3" opacity="0.55"/>
    <circle cx="430" cy="368" r="1.1" opacity="0.5"/><circle cx="640" cy="342" r="1.5" opacity="0.6"/>
    <circle cx="860" cy="378" r="1.0" opacity="0.4"/><circle cx="1050" cy="352" r="1.2" opacity="0.5"/>
    <circle cx="1470" cy="44" r="1.3" opacity="0.6"/><circle cx="1540" cy="120" r="1.0" opacity="0.45"/>
    <circle cx="60" cy="250" r="1.2" opacity="0.5"/><circle cx="980" cy="120" r="1.0" opacity="0.4"/>
  </g>

  <!-- compass rose x Bloch sphere, right side -->
  <g transform="translate(1272 210)">
    <!-- flat chart ring + rhumb lines, seen at chart tilt -->
    <g transform="scale(1 0.40)">
      <circle r="168" fill="none" stroke="#C9A227" stroke-width="2.2" opacity="0.55"/>
      <g stroke="#C9A227" stroke-width="1.4" opacity="0.20">
        <line x1="0" y1="0" x2="168" y2="0"/><line x1="0" y1="0" x2="145.5" y2="84"/>
        <line x1="0" y1="0" x2="84" y2="145.5"/><line x1="0" y1="0" x2="0" y2="168"/>
        <line x1="0" y1="0" x2="-84" y2="145.5"/><line x1="0" y1="0" x2="-145.5" y2="84"/>
        <line x1="0" y1="0" x2="-168" y2="0"/><line x1="0" y1="0" x2="-145.5" y2="-84"/>
        <line x1="0" y1="0" x2="-84" y2="-145.5"/><line x1="0" y1="0" x2="0" y2="-168"/>
        <line x1="0" y1="0" x2="84" y2="-145.5"/><line x1="0" y1="0" x2="145.5" y2="-84"/>
      </g>
    </g>
    <!-- Bloch orbits -->
    <ellipse rx="150" ry="150" fill="none" stroke="#5B8CFF" stroke-width="2.4" opacity="0.9" transform="rotate(-24) scale(1 0.36)"/>
    <ellipse rx="150" ry="150" fill="none" stroke="#7C5CFF" stroke-width="2.2" opacity="0.65" transform="rotate(38) scale(1 0.36)"/>
    <ellipse rx="150" ry="150" fill="none" stroke="#5B8CFF" stroke-width="2.0" opacity="0.5" transform="rotate(84) scale(1 0.36)"/>
    <!-- core -->
    <circle r="42" fill="none" stroke="#E8EEF7" stroke-width="1.6" opacity="0.55"/>
    <ellipse rx="42" ry="15" fill="none" stroke="#E8EEF7" stroke-width="1.2" opacity="0.4"/>
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#E8EEF7" stroke-width="1.2" opacity="0.4"/>
    <circle r="5" fill="#C9A227"/>
    <!-- light pulses on the cherenkov orbit -->
    <circle cx="106" cy="-58" r="5.5" fill="#BFD4FF"/>
    <circle cx="-128" cy="34" r="4.5" fill="#BFD4FF" opacity="0.85"/>
  </g>

  <!-- wordmark block, left -->
  <text x="84" y="118" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="19" letter-spacing="5" fill="#C9A227">47.66&#176; N &#183; 117.43&#176; W &#8212; SPOKANE, FIXED</text>
  <text x="80" y="212" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="4" fill="#E8EEF7">QOMPASS <tspan fill="#5B8CFF">AI</tspan></text>
  <text x="84" y="272" font-family="'Space Grotesk', 'Inter', Arial, sans-serif" font-size="33" font-weight="500" letter-spacing="2" fill="#E8EEF7">Navigation for the <tspan fill="#5B8CFF">quantum age</tspan>.</text>
  <text x="84" y="330" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="16.5" letter-spacing="3.5" fill="#8CA3C3">POST-QUANTUM SYSTEMS &#183; AGENT RUNTIMES &#183; DEEP-TECH RESEARCH</text>
  <line x1="84" y1="356" x2="760" y2="356" stroke="#8F741F" stroke-width="1.4"/>
</svg>
